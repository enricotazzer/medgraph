# Development cohort for building and testing the pipeline.
# Synthea's diseases follow hand-written modules: nothing computed on this cohort is
# clinically meaningful, and results on it are labelled as pipeline tests.
name: dev-1000
description: Development cohort, 1,000 patients, Massachusetts, 10 years of exported history.
synthea:
  version: v4.0.0
  jar_url: https://github.com/synthetichealth/synthea/releases/download/v4.0.0/synthea-with-dependencies.jar
  jar_sha256: ed43c20ad40ba5c3bc724503a5af032715fe3c491620b766148e7c2361e6ecc1
population: 1000
seed: 42
clinician_seed: 42
reference_date: 2026-01-01  # passed as both -r and -e
state: Massachusetts
# Explicit even where they equal the v4.0.0 defaults, so a default change cannot slip in.
properties:
  exporter.fhir.export: true
  exporter.fhir.use_us_core_ig: true
  exporter.fhir.us_core_version: 6.1.0
  exporter.hospital.fhir.export: true
  exporter.practitioner.fhir.export: true
  exporter.csv.export: false
  exporter.ccda.export: false
  exporter.text.export: false
  exporter.years_of_history: 10
