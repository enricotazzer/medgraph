# Runs on `git commit`. On demand: uv run pre-commit run --all-files
# ruff and mypy run through uv so they use the versions pinned in uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # Vendored libraries are pinned by hash: never rewrite them.
      - id: end-of-file-fixer
        exclude: ^src/medgraph/graph/static/vendor/
      - id: trailing-whitespace
        exclude: ^src/medgraph/graph/static/vendor/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Notebook outputs can hold record values: never commit them.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: forbid-data-files
        name: forbid data, model artifacts and env files
        entry: python scripts/dev/forbid_data_files.py
        language: python
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
